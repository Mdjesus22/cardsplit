# Pings your Supabase database once a day so the free project never pauses.
# It reads the URL and key from index.html — nothing to edit here.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 1 * * *'   # every day, 9:17 AM Philippine time
  workflow_dispatch:       # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" index.html)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" index.html)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
