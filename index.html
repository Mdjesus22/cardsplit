<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>CardSplit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='16' width='40' height='30' rx='9' fill='%23CBBDFF'/%3E%3Crect x='20' y='12' width='40' height='30' rx='9' fill='%23FFC9B0' fill-opacity='.92'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F3FC; --card:#FFFFFF; --ink:#2B2640; --muted:#7B7494; --line:#ECE7F6; --soft:#FAF8FE;
  --brand:#6A53D6; --brand-ink:#FFFFFF; --brand-soft:#EEE8FF; --brand-fill:#CBBDFF; --brand-fill-ink:#2B2153;
  --paid:#1F7A57; --paid-bg:#D5F5E6; --part:#8A5A00; --part-bg:#FFEFC2; --unpaid:#B23A5A; --unpaid-bg:#FFDCE5;
  --mine:#5E5873; --mine-bg:#ECE8F4; --shadow:0 1px 2px rgba(60,40,120,.05),0 6px 18px rgba(60,40,120,.06);
  --t-lav:#EEE8FF; --t-sky:#E2F0FF; --t-rose:#FFE6EC; --t-mint:#DDF6EC; --t-peach:#FFE9DD; --t-butter:#FFF4D1;
  --s1:#7C66E0; --s2:#E2703F; --track:#F0ECF8;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17141F; --card:#221E2E; --ink:#EEEAF8; --muted:#A9A2BF; --line:#332D44; --soft:#1C1927;
    --brand:#B9A8FF; --brand-ink:#1E1640; --brand-soft:#2E2650; --brand-fill:#B9A8FF; --brand-fill-ink:#1E1640;
    --paid:#8FE3BF; --paid-bg:#1E3A30; --part:#FFD37A; --part-bg:#3A3018; --unpaid:#FF9DB5; --unpaid-bg:#3D1F2A;
    --mine:#CFC8E3; --mine-bg:#2E2940; --shadow:none;
    --t-lav:#2B2542; --t-sky:#1F2C40; --t-rose:#3A2230; --t-mint:#1D352C; --t-peach:#3A2A22; --t-butter:#36301C;
    --s1:#8B78EC; --s2:#D9733F; --track:#2C2740;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:680px;margin:0 auto}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:20px}
.iconbtn:active{background:var(--line)}
.monthpick{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:2px}
.monthpick button{border:0;background:transparent;width:34px;height:34px;border-radius:999px;cursor:pointer;font-size:18px}
.monthpick span{min-width:78px;text-align:center;font-weight:600;font-size:14px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.bottom .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.bottom button{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav.bottom button .ic{font-size:20px;line-height:1}
nav.bottom button.on{color:var(--brand);font-weight:600}
nav.bottom button.add .ic{width:48px;height:48px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:28px;margin-top:-18px;box-shadow:0 4px 12px rgba(15,118,110,.35)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:10px 0}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 2px 6px}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.right{text-align:right}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.big{font-size:22px;font-weight:700}
.b{font-weight:600}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px}
.tile .lbl{font-size:12px;color:var(--muted)}
.tile .val{font-size:18px;font-weight:700;margin-top:2px}
.list .item{display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--mine-bg);color:var(--mine);white-space:nowrap}
.chip.paid{background:var(--paid-bg);color:var(--paid)}
.chip.partial{background:var(--part-bg);color:var(--part)}
.chip.unpaid{background:var(--unpaid-bg);color:var(--unpaid)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--mine-bg);color:var(--mine)}
.pill.red{background:var(--unpaid-bg);color:var(--unpaid)}
.pill.green{background:var(--paid-bg);color:var(--paid)}
.pill.amber{background:var(--part-bg);color:var(--part)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--unpaid);border-color:var(--unpaid-bg)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.seg{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 11px;min-height:42px}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px;margin-top:8px}
.kv .k{color:var(--muted)}
details>summary{cursor:pointer;color:var(--brand);font-size:13px;font-weight:600;margin-top:8px;list-style:none}
details>summary::-webkit-details-marker{display:none}
/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet .sh h2{font-size:16px;margin:0;flex:1}
.sheet .sb{padding:4px 16px 16px;overflow-y:auto;flex:1}
.sheet .sf{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sheet .sf .grow{display:flex;gap:8px;justify-content:flex-end}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.charge{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--card)}
.charge .top{display:grid;grid-template-columns:1fr 130px 36px;gap:6px;align-items:center}
.charge .pay{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;gap:8px;flex-wrap:wrap}
.charge .extra{display:grid;grid-template-columns:150px 1fr;gap:6px;margin-top:6px}
.charge .plist{margin-top:6px;font-size:12.5px}
.charge .plist div{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-top:1px dashed var(--line)}
.sumline{font-size:13px;margin:6px 2px}
.sumline.bad{color:var(--unpaid);font-weight:600}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45)}
.drawer .pane{position:absolute;left:0;top:0;bottom:0;width:min(300px,85vw);background:var(--card);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.drawer .pane button{border:0;background:transparent;text-align:left;padding:12px 10px;border-radius:10px;cursor:pointer;font-size:15px}
.drawer .pane button:active{background:var(--line)}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.loginbox{width:100%;max-width:380px}
.err{color:var(--unpaid);font-size:13px;margin-top:8px}
.linkish{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-weight:600}
.over{color:var(--unpaid);font-weight:600}
.hb{display:block;width:100%;border:0;background:transparent;padding:6px 0;cursor:pointer;text-align:left}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:4px}
.hb-t{display:block;height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.hb-t>i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.trend{width:100%;height:auto;display:block}
.trend .b-inc{fill:var(--s1)} .trend .b-exp{fill:var(--s2)}
.trend .ax{fill:var(--muted);font-size:11px} .trend .axl{stroke:var(--line);stroke-width:1}
.trend .tg{cursor:pointer} .trend .tg.on rect{fill:var(--track)} .trend .b-bill{fill:var(--s1)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .sw.inc{background:var(--s1)} .legend .sw.exp{background:var(--s2)}
/* ---- pastel theme ---- */
html,body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
header.top h1{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:0}
.logo{width:30px;height:22px;flex:none}
.iconbtn svg,.monthpick svg{width:20px;height:20px}
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.monthpick{box-shadow:none;border:1px solid var(--line)}
.monthpick button{display:grid;place-items:center;color:var(--muted)}
nav.bottom{border-top:0;box-shadow:0 -6px 24px rgba(60,40,120,.08);border-radius:22px 22px 0 0}
nav.bottom button{gap:3px;font-weight:700;font-size:11px}
nav.bottom button .ic{display:grid;place-items:center;width:46px;height:30px;border-radius:999px;transition:background .15s}
nav.bottom button .ic svg{width:22px;height:22px}
nav.bottom button.on{color:var(--brand);font-weight:800}
nav.bottom button.on .ic{background:var(--brand-soft)}
nav.bottom button.add .ic{width:54px;height:54px;border-radius:19px;background:var(--brand-fill);color:var(--brand-fill-ink);margin-top:-22px;box-shadow:0 8px 20px rgba(124,102,224,.35)}
nav.bottom button.add .ic svg{width:26px;height:26px;stroke-width:2.4}
.card{border-radius:var(--r)}
.tile{border-radius:var(--r);padding:13px 14px}
.tile.t-lav,.tile.t-sky,.tile.t-rose,.tile.t-mint,.tile.t-peach,.tile.t-butter{box-shadow:none}
.t-lav{background:var(--t-lav)} .t-sky{background:var(--t-sky)} .t-rose{background:var(--t-rose)} .t-mint{background:var(--t-mint)} .t-peach{background:var(--t-peach)} .t-butter{background:var(--t-butter)}
.tile .lbl{font-weight:700;color:var(--muted)}
.tile .val{font-weight:800;font-size:19px}
.sec{text-transform:none;letter-spacing:0;font-size:14px;font-weight:800;color:var(--ink);margin:20px 4px 8px}
.btn{border-radius:12px;font-weight:700}
.btn.pri{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--brand-fill-ink)}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand);display:flex;align-items:center;justify-content:center;gap:8px}
.seg{box-shadow:none;border:1px solid var(--line)}
.seg button{font-weight:700}
.seg button.on{background:var(--brand-fill);color:var(--brand-fill-ink)}
.chip{font-weight:700}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.converted{background:var(--mine-bg);color:var(--mine)}
.pill{font-weight:800}
.cardglyph{flex:none;width:36px;height:26px;margin-top:2px}
.ibubble{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--ink)}
.ibubble svg{width:21px;height:21px}
.drawer .pane{border-radius:0 22px 22px 0}
.drawer .pane button{display:flex;align-items:center;gap:12px;font-weight:700}
.drawer .pane button svg{width:20px;height:20px;color:var(--brand)}
.sheet{border-radius:24px 24px 0 0}
.sheet .sh{border-bottom-color:var(--line)}
.overlay{background:rgba(43,38,64,.38)}
input.in,select.in,textarea.in{border-radius:12px}
button.in{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 11px;min-height:42px;color:var(--ink)}
input[type=checkbox],input[type=radio]{accent-color:var(--brand)}
.hb-t>i{border-radius:0 6px 6px 0}
</style>

<body>
<div id="root"></div>
<script type="module">
/* =====================================================================
   CardSplit — personal credit card tracker
   1) Paste your Supabase Project URL and Publishable key below.
   2) Upload this file to GitHub Pages (see SETUP guide).
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://unuwnlgklvjfjqvlodqc.supabase.co',   // e.g. 'https://abcdefghijkl.supabase.co'
  SUPABASE_KEY: 'sb_publishable_gVueHnZaIprCyd3dxlA-Xw_0XoL53hx',   // e.g. 'sb_publishable_xxxxxxxxxxxxxxxx'
};

const VERSION = '1.9';
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');
const TABLES = ['cards','people','statements','installments','installment_shares','transactions','charges','collections','categories','recurring','entries'];
const OPT_TABLES = ['categories','recurring','entries'];   // Money tab — created by 3-money.sql
const SETNULL = { recurring:[['entries','recurring_id']] };
const CASCADE = { transactions:[['charges','transaction_id']], charges:[['collections','charge_id']],
                  installments:[['installment_shares','installment_id'],['transactions','installment_id']] };
const DEFAULTS = { cards:{active:true}, people:{kind:'person',active:true}, statements:{paid_to_bank:false},
                   installments:{status:'active'}, transactions:{source:'manual'},
                   categories:{active:true, sort:0}, entries:{planned:true, expected:false}, recurring:{active:true} };

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((Number(n || 0) + Number.EPSILON) * 100) / 100;
const PH = new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' });
const peso = n => PH.format(r2(n));
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthOf = iso => iso.slice(0, 7) + '-01';
const addMonths = (m, k) => { const [y, mo] = m.split('-').map(Number); const t = y*12 + (mo-1) + k; return `${Math.floor(t/12)}-${pad(t%12+1)}-01`; };
const monthDiff = (a, b) => { const [ya, ma] = a.split('-').map(Number); const [yb, mb] = b.split('-').map(Number); return (ya*12+ma) - (yb*12+mb); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthLabel = m => m ? `${MON[+m.slice(5,7)-1]} ${m.slice(0,4)}` : '';
const dateLabel = iso => iso ? `${MON[+iso.slice(5,7)-1]} ${+iso.slice(8,10)}` : '';
const dateLabelY = iso => iso ? `${MON[+iso.slice(5,7)-1]} ${+iso.slice(8,10)}, ${iso.slice(0,4)}` : '';
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);
const groupBy = (arr, key) => { const m = new Map(); for (const r of arr) { const k = r[key]; if (!m.has(k)) m.set(k, []); m.get(k).push(r); } return m; };
const num = v => (v === '' || v == null) ? null : Number(v);
const sum = (arr, f = x => x) => r2(arr.reduce((a, x) => a + Number(f(x) || 0), 0));

/* ---------------- data layer ---------------- */
function cascadeLocal(store, t, id) {
  store[t] = store[t].filter(r => r.id !== id);
  for (const [child, fk] of (CASCADE[t] || [])) {
    for (const r of store[child].filter(r => r[fk] === id)) cascadeLocal(store, child, r.id);
  }
  for (const [child, fk] of (SETNULL[t] || [])) for (const r of (store[child] || [])) if (r[fk] === id) r[fk] = null;
}
function makeDemoDB(seed) {
  const data = structuredClone(seed); const next = {};
  for (const t of TABLES) { data[t] = data[t] || []; next[t] = data[t].reduce((a, r) => Math.max(a, r.id), 0) + 1; }
  return {
    async loadAll() { return structuredClone(data); },
    async insert(t, rows) {
      const out = rows.map(r => ({ ...(DEFAULTS[t] || {}), ...r, id: next[t]++ }));
      if (t === 'transactions') for (const r of out) if (r.installment_id && data.transactions.some(x => x.installment_id === r.installment_id && x.installment_no === r.installment_no)) throw new Error('duplicate installment month');
      data[t].push(...structuredClone(out)); return out;
    },
    async update(t, id, patch) { const r = data[t].find(x => x.id === id); Object.assign(r, patch); return { ...r }; },
    async remove(t, id) { cascadeLocal(data, t, id); },
    async hasExpected() { return true; },
  };
}
function makeSupabaseDB(sb) {
  return {
    async loadAll() {
      const out = {};
      await Promise.all(TABLES.map(async t => {
        try {
          let rows = [], from = 0;
          for (;;) {
            const { data, error } = await sb.from(t).select('*').order('id').range(from, from + 999);
            if (error) throw error;
            rows = rows.concat(data); if (data.length < 1000) break; from += 1000;
          }
          out[t] = rows;
        } catch (e) { if (OPT_TABLES.includes(t)) out[t] = null; else throw e; }   // Money tables not created yet
      }));
      return out;
    },
    async insert(t, rows) { const { data, error } = await sb.from(t).insert(rows).select(); if (error) throw error; return data; },
    async update(t, id, patch) { const { data, error } = await sb.from(t).update(patch).eq('id', id).select().single(); if (error) throw error; return data; },
    async remove(t, id) { const { error } = await sb.from(t).delete().eq('id', id); if (error) throw error; },
    async hasExpected() { const { error } = await sb.from('entries').select('expected').limit(1); return !error; },   // 4-expected.sql run?
  };
}

let sb = null, db = null;
let S = Object.fromEntries(TABLES.map(t => [t, []]));
let IX = {};
const UI = { view: 'home', month: addMonths(monthOf(todayISO()), -1), instFilter: 'active',
             mMonth: monthOf(todayISO()), mHalf: 0, mPlanned: 'all', mCards: true, mSel: null, mTab: 'sum', oCycle: 0, oPromises: true,
             f: { scope: 'month', card: '', people: [], status: '', q: '' }, cf: { card: '', scope: 'month' } };

// local mutations (DB first, then local copy)
async function ins(t, rows) { const out = await db.insert(t, rows); S[t].push(...out); reindex(); return out; }
async function upd(t, id, patch) { const out = await db.update(t, id, patch); const i = S[t].findIndex(r => r.id === id); if (i >= 0) S[t][i] = out; reindex(); return out; }
async function del(t, id) { await db.remove(t, id); cascadeLocal(S, t, id); reindex(); }

function reindex() {
  IX.card = new Map(S.cards.map(r => [r.id, r]));
  IX.person = new Map(S.people.map(r => [r.id, r]));
  IX.inst = new Map(S.installments.map(r => [r.id, r]));
  IX.tx = new Map(S.transactions.map(r => [r.id, r]));
  IX.charge = new Map(S.charges.map(r => [r.id, r]));
  IX.chargesByTx = groupBy(S.charges, 'transaction_id');
  IX.chargesByPerson = groupBy(S.charges, 'person_id');
  IX.collByCharge = groupBy(S.collections, 'charge_id');
  IX.sharesByInst = groupBy(S.installment_shares, 'installment_id');
  IX.txByInst = groupBy(S.transactions.filter(t => t.installment_id), 'installment_id');
  IX.stmt = new Map(S.statements.map(s => [s.card_id + '|' + s.month, s]));
  IX.me = (S.people.find(p => p.kind === 'me') || {}).id;
  IX.cat = new Map((S.categories || []).map(r => [r.id, r]));
}
const received = ch => sum(IX.collByCharge.get(ch.id) || [], c => c.amount);
const balance = ch => r2(Number(ch.amount) - received(ch));
const isMe = pid => IX.person.get(pid)?.kind === 'me';
const personName = pid => IX.person.get(pid)?.name ?? '?';
// Straight purchase converted to installment (or fully refunded): the purchase and its cancelling credit
// are both marked with this category and are left out of who-owes / balances / Money.
const CONVERTED = 'Converted to installment';
const isConv = t => !!t && t.category === CONVERTED;
const live = c => !isConv(IX.tx.get(c.transaction_id));
// Advance = they paid MORE than the item (a refund line is not an advance). You hold this money until it's used.
const advanceOf = c => (Number(c.amount) > 0 && live(c)) ? Math.max(0, r2(-balance(c))) : 0;
const personAdvance = pid => r2(sum(IX.chargesByPerson.get(pid) || [], advanceOf));
function advanceCharges(pid) {
  return (IX.chargesByPerson.get(pid) || []).filter(c => advanceOf(c) > 0.004)
    .sort((a, b) => IX.tx.get(a.transaction_id).month.localeCompare(IX.tx.get(b.transaction_id).month) || a.id - b.id);
}
// Pay new charges from the person's advance (oldest advance first). Returns { total, n }.
async function applyAdvances(charges) {
  const rows = [], left = new Map(), today = todayISO(); let total = 0, n = 0;
  const list = [...charges].sort((a, b) => (IX.tx.get(a.transaction_id)?.month || '').localeCompare(IX.tx.get(b.transaction_id)?.month || '') || a.id - b.id);
  for (const c of list) {
    if (isMe(c.person_id) || !(Number(c.amount) > 0)) continue;
    let need = r2(Number(c.amount)); const start = need;
    for (const s of advanceCharges(c.person_id)) {
      const avail = left.has(s.id) ? left.get(s.id) : advanceOf(s); if (avail <= 0.004) continue;
      const take = r2(Math.min(avail, need)); left.set(s.id, r2(avail - take)); need = r2(need - take); total = r2(total + take);
      rows.push({ charge_id: s.id, amount: -take, received_on: today, note: 'Advance used' }, { charge_id: c.id, amount: take, received_on: today, note: 'Paid from advance' });
      if (need <= 0.004) break;
    }
    if (need < start) n++;
  }
  if (rows.length) await ins('collections', rows);
  return { total, n };
}
function chargeStatus(ch) {
  if (!live(ch)) return 'converted';
  if (isMe(ch.person_id)) return 'mine';
  const b = balance(ch);
  if (b <= 0.004) return 'paid';
  return received(ch) > 0.004 ? 'partial' : 'unpaid';
}
const STATUS_LABEL = { paid: 'Paid', partial: 'Partial', unpaid: 'Unpaid', mine: 'Mine', converted: 'Converted' };
const cardLabel = id => { const c = IX.card.get(id); return c ? (c.bank || c.code) + (c.last4 ? ' ••' + c.last4 : '') : '?'; };
const cardCode = id => IX.card.get(id)?.code ?? '?';
function dueDate(cardId, month) {
  const s = IX.stmt.get(cardId + '|' + month);
  if (s?.due_date) return s.due_date;
  const c = IX.card.get(cardId); if (!c?.due_day) return null;
  const dm = addMonths(month, 1); const [y, m] = dm.split('-').map(Number);
  return `${y}-${pad(m)}-${pad(Math.min(c.due_day, new Date(y, m, 0).getDate()))}`;
}
function planInfo(p, asOf) {
  const monthly = Number(p.monthly_amount);
  const total = r2(monthly * p.months);
  const orig = p.original_amount == null ? null : Number(p.original_amount);
  const interest = orig == null ? null : r2(total - orig);
  const ended = p.status === 'ended_early';
  const billed = Math.max(0, Math.min(p.months, monthDiff(asOf, p.first_month) + 1));
  const left = ended ? 0 : p.months - billed;
  const status = ended ? 'ended' : billed >= p.months ? 'done' : billed === 0 ? 'notyet' : 'active';
  const charges = (IX.txByInst.get(p.id) || []).flatMap(t => IX.chargesByTx.get(t.id) || []).filter(c => !isMe(c.person_id));
  return { monthly, total, orig, interest, perMonth: interest == null ? null : r2(interest / p.months),
           pct: orig ? interest / orig : null, billed, left, remaining: r2(left * monthly), status,
           last: addMonths(p.first_month, p.months - 1), owed: sum(charges, balance), collected: sum(charges, received) };
}

/* ---------------- installments: create missing months ---------------- */
function splitFromShares(p) {
  const shares = (IX.sharesByInst.get(p.id) || []).filter(s => Number(s.monthly_share) > 0)
                  .map(s => ({ person_id: s.person_id, amount: r2(s.monthly_share) }));
  if (!shares.length) return [{ person_id: IX.me, amount: r2(p.monthly_amount) }];
  const diff = r2(Number(p.monthly_amount) - sum(shares, s => s.amount));
  if (Math.abs(diff) >= 0.005) {
    const me = shares.find(s => s.person_id === IX.me);
    if (me) me.amount = r2(me.amount + diff);
    else if (diff > 0 && IX.me) shares.push({ person_id: IX.me, amount: diff });
    else shares[shares.length - 1].amount = r2(shares[shares.length - 1].amount + diff);
  }
  return shares;
}
async function ensureInstallmentMonths() {
  const cur = monthOf(todayISO());
  const todo = [];
  for (const p of S.installments) {
    if (p.status !== 'active') continue;
    const have = new Set((IX.txByInst.get(p.id) || []).map(t => t.installment_no));
    const lastNo = Math.max(0, ...have);
    const upto = Math.min(p.months, monthDiff(cur, p.first_month) + 1);
    for (let no = lastNo + 1; no <= upto; no++) todo.push({ p, no });
  }
  if (!todo.length) return 0;
  const txs = await ins('transactions', todo.map(({ p, no }) => ({
    card_id: p.card_id, month: addMonths(p.first_month, no - 1), txn_date: null, description: p.item,
    category: 'LOAN', amount: r2(p.monthly_amount), installment_id: p.id, installment_no: no, source: 'auto' })));
  const rows = [];
  for (const t of txs) for (const c of splitFromShares(IX.inst.get(t.installment_id))) rows.push({ ...c, transaction_id: t.id });
  const made = await ins('charges', rows);
  try { const a = await applyAdvances(made); if (a.total > 0.004) UI._advMsg = ` · ${peso(a.total)} paid from advances`; } catch (e) { console.error(e); }
  return txs.length;
}

function stmtTotals(st, inApp) {
  const bill = st?.total_due == null ? null : Number(st.total_due);
  if (bill == null) return `<div class="b">${peso(inApp)}</div><div class="small muted">in app</div>`;
  const diff = r2(inApp - bill);

    (Math.abs(diff) < 0.01 ? `<div class="small" style="color:var(--paid)">matches app ✓</div>` : `<div class="small over">app ${peso(inApp)} ⚠</div>`);
}

/* ---------------- CHART: who has the most bills ---------------- */
function viewChart() {
  const cf = UI.cf, cardId = cf.card ? +cf.card : 0;
  const months = [...Array(12)].map((_, i) => addMonths(UI.month, i - 11));
  const all = [];   // live charges on the picked card, statement months in the last 12
  for (const c of S.charges) { const t = IX.tx.get(c.transaction_id); if (!t || isConv(t)) continue;
    if (cardId && t.card_id !== cardId) continue; if (t.month < months[0] || t.month > UI.month) continue; all.push({ c, t }); }
  const tot = new Map(months.map(m => [m, 0]));
  for (const { c, t } of all) tot.set(t.month, r2(tot.get(t.month) + Number(c.amount)));
  const max = Math.max(1, ...tot.values());
  const W = 340, H = 150, base = 122, top = 10, gw = W / 12, bw = 14;
  const y = v => base - (Math.max(0, v) / max) * (base - top);
  const cols = months.map((m, i) => { const v = tot.get(m), x = i * gw + (gw - bw) / 2, yy = y(v), h = base - yy, r = Math.min(4, h, bw / 2);
    return `<g class="tg${m === UI.month ? ' on' : ''}" data-action="billMonth" data-m="${m}"><rect x="${i * gw}" y="0" width="${gw}" height="${H}" fill="transparent"/>
      <title>${monthLabel(m)}: ${peso(v)}</title>
      ${h >= 0.5 ? `<path class="b-bill" d="M${x},${base} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${base} Z"/>` : ''}
      <text x="${i * gw + gw / 2}" y="${base + 16}" text-anchor="middle" class="ax">${MON[+m.slice(5, 7) - 1]}</text></g>`; }).join('');
  const rows = cf.scope === 'month' ? all.filter(x => x.t.month === UI.month) : all;
  const per = new Map();
  for (const { c } of rows) { const p = per.get(c.person_id) || { id: c.person_id, amt: 0, n: 0, owed: 0 };
    p.amt = r2(p.amt + Number(c.amount)); p.n++; if (!isMe(c.person_id)) p.owed = r2(p.owed + balance(c)); per.set(c.person_id, p); }
  const ranked = [...per.values()].filter(p => p.amt > 0.004).sort((a, b) => b.amt - a.amt);
  const total = sum(ranked, p => p.amt), top1 = ranked[0]?.amt || 1;
  const opt = (v, l, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${esc(l)}</option>`;
  return `${cardsSeg()}
    <select class="in" style="margin-top:10px" data-cf="card">${opt('', 'All cards', cf.card)}${S.cards.map(c => opt(c.id, cardLabel(c.id), cf.card)).join('')}</select>
    <div class="sec">Billed per month · last 12 months</div>
    <div class="card"><svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Amount billed per statement month">
      <line x1="0" x2="${W}" y1="${base}" y2="${base}" class="axl"/>${cols}</svg>
      <div class="small" style="margin-top:4px"><b>${monthLabel(UI.month)}</b> · ${peso(tot.get(UI.month))} billed <span class="muted">· tap a month to see it</span></div></div>
    <div class="sec">Who has the most bills</div>
    <div class="seg"><button class="${cf.scope === 'month' ? 'on' : ''}" data-action="cfScope" data-v="month">${monthLabel(UI.month)}</button><button class="${cf.scope === 'year' ? 'on' : ''}" data-action="cfScope" data-v="year">Last 12 months</button></div>
    <div class="card" style="margin-top:8px">${ranked.length ? ranked.map(p => `<button class="hb" data-action="billPerson" data-id="${p.id}">
        <span class="hb-l"><span class="ell">${esc(personName(p.id))} <span class="muted">· ${p.n} item${p.n === 1 ? '' : 's'}</span></span><span><b>${peso(p.amt)}</b> <span class="muted">${Math.round(p.amt / total * 100)}%</span></span></span>
        <span class="hb-t"><i style="width:${Math.max(2, p.amt / top1 * 100)}%"></i></span>
        ${p.owed > 0.004 ? `<span class="small" style="display:block;margin-top:3px;color:var(--unpaid)">Still owes ${peso(p.owed)}</span>` : ''}</button>`).join('') : '<div class="empty">No bills for this period.</div>'}</div>
    <p class="small muted">Tap a person to see their transactions. Lines converted to installment are left out.</p>`;
}

function bindDraft(o, d) {
  o.querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => {
    let v = el.value;
    if (el.hasAttribute('data-num')) v = Number(v);
    if (el.hasAttribute('data-month')) v = v ? v + '-01' : d[el.dataset.k];
    d[el.dataset.k] = v;
    const sl = o.querySelector('#sumline'); if (sl) { sl.innerHTML = txSumLine(d); sl.className = 'sumline' + (sl.textContent.includes('✓') ? '' : ' bad'); }
  }));
  o.querySelectorAll('[data-ci]').forEach(el => el.addEventListener('input', () => {
    const c = d.charges[+el.dataset.ci]; c[el.dataset.ck] = el.dataset.ck === 'person_id' ? Number(el.value) : el.value;
    const sl = o.querySelector('#sumline'); if (sl) { sl.innerHTML = txSumLine(d); sl.className = 'sumline' + (sl.textContent.includes('✓') ? '' : ' bad'); }
  }));
  o.querySelectorAll('select[data-ci]').forEach(el => el.addEventListener('change', () => redrawTop()));
  const sl = o.querySelector('#sumline'); if (sl) sl.className = 'sumline' + (sl.textContent.includes('✓') ? '' : ' bad');
}

async function saveTx() {
  const d = SHEETS[SHEETS.length - 1].draft;
  const amount = r2(num(d.amount));
  if (!d.description.trim()) return toast('Add a description');
  if (!amount) return toast('Add an amount');
  if (!d.card_id) return toast('Pick a card (add one from ☰ → Cards)');
  const charges = d.charges.map(c => ({ ...c, amount: r2(num(c.amount)) }));
  if (!charges.length) return toast('Add at least one person');
  if (new Set(charges.map(c => c.person_id)).size !== charges.length) return toast('Same person is listed twice');
  if (Math.abs(r2(amount - sum(charges, c => c.amount))) >= 0.005) return toast('Who pays must add up to the amount');
  const row = { description: d.description.trim(), amount, card_id: d.card_id, month: d.month, txn_date: d.txn_date || null, category: (d.category || '').trim() || null };
  try {
    let txId = d.id;
    if (d.id) await upd('transactions', d.id, row);
    else { const [t] = await ins('transactions', [{ ...row, source: 'manual' }]); txId = t.id; }
    const old = IX.chargesByTx.get(txId) || [];
    const keep = new Set(charges.filter(c => c.id).map(c => c.id));
    const dropping = old.filter(o => !keep.has(o.id));
    const lost = sum(dropping.flatMap(o => IX.collByCharge.get(o.id) || []), p => p.amount);
    if (lost && !(await ask(`Removing a person also removes ${peso(lost)} of their recorded payments. Continue?`, 'Remove', true))) return;
    for (const o of dropping) await del('charges', o.id);
    for (const c of charges.filter(c => c.id)) {
      const o = IX.charge.get(c.id);
      const patch = { person_id: c.person_id, amount: c.amount, promise_date: c.promise_date || null, note: (c.note || '').trim() || null };
      if (o.person_id !== patch.person_id || Number(o.amount) !== patch.amount || (o.promise_date || null) !== patch.promise_date || (o.note || null) !== patch.note) await upd('charges', c.id, patch);
    }
    const fresh = charges.filter(c => !c.id).map(c => ({ transaction_id: txId, person_id: c.person_id, amount: c.amount, promise_date: c.promise_date || null, note: (c.note || '').trim() || null }));
    if (fresh.length) await ins('charges', fresh);
    closeSheet(); render(); toast('Saved');
  } catch (e) { console.error(e); toast('Could not save: ' + (e.message || e)); }
}

/* ---------------- INSTALLMENTS ---------------- */
function viewInst() {
  const asOf = UI.month;
  const all = S.installments.map(p => ({ p, i: planInfo(p, asOf) }));
  const counts = { active: 0, done: 0, ended: 0 };
  all.forEach(x => { if (x.i.status === 'active' || x.i.status === 'notyet') counts.active++; else counts[x.i.status]++; });
  const f = UI.instFilter;
  const list = all.filter(x => f === 'all' || (f === 'active' ? ['active', 'notyet'].includes(x.i.status) : x.i.status === f))
    .sort((a, b) => (b.i.left - a.i.left) || b.p.first_month.localeCompare(a.p.first_month));
  const act = all.filter(x => x.i.status === 'active');
  const segBtn = (v, l) => `<button class="${f === v ? 'on' : ''}" data-action="instFilter" data-v="${v}">${l}</button>`;
  return `${cardsSeg()}
    <div class="seg" style="margin-top:6px">${segBtn('active', `Ongoing (${counts.active})`)}${segBtn('done', `Done (${counts.done})`)}${segBtn('ended', `Ended early (${counts.ended})`)}${segBtn('all', 'All')}</div>

async function savePlan() {
  const d = SHEETS[SHEETS.length - 1].draft;
  const row = { item: d.item.trim(), reason: d.reason.trim() || null, card_id: d.card_id, original_amount: num(d.original_amount) == null ? null : r2(num(d.original_amount)),
                monthly_amount: r2(num(d.monthly_amount)), months: parseInt(d.months, 10), first_month: d.first_month, status: d.status,
                ended_month: d.status === 'ended_early' ? (d.ended_month || UI.month) : null, notes: d.notes.trim() || null };
  if (!row.item) return toast('Add the item name');
  if (!(row.monthly_amount > 0)) return toast('Add the monthly amount');
  if (!(row.months > 0)) return toast('Add the number of months');
  const shares = d.shares.map(s => ({ ...s, amount: r2(num(s.amount)) })).filter(s => s.person_id);
  if (new Set(shares.map(s => s.person_id)).size !== shares.length) return toast('Same person is listed twice');
  try {
    let pid = d.id;
    if (pid) await upd('installments', pid, row); else { const [p] = await ins('installments', [row]); pid = p.id; }
    const old = IX.sharesByInst.get(pid) || [];
    const keep = new Set(shares.filter(s => s.id).map(s => s.id));
    for (const o of old.filter(o => !keep.has(o.id))) await del('installment_shares', o.id);
    for (const s of shares.filter(s => s.id)) { const o = old.find(x => x.id === s.id); if (o && (o.person_id !== s.person_id || Number(o.monthly_share) !== s.amount)) await upd('installment_shares', s.id, { person_id: s.person_id, monthly_share: s.amount }); }
    const fresh = shares.filter(s => !s.id).map(s => ({ installment_id: pid, person_id: s.person_id, monthly_share: s.amount }));
    if (fresh.length) await ins('installment_shares', fresh);
    const made = await ensureInstallmentMonths();
    closeSheet(); render(); toast(made ? `Saved · ${made} month${made === 1 ? '' : 's'} added` : 'Saved');
  } catch (e) { console.error(e); toast('Could not save: ' + (e.message || e)); }
}

// Undo "Use credits" payments that were made with a conversion credit
function creditUseRows(txIds) {
  const out = [];
  for (const tid of txIds) for (const c of (IX.chargesByTx.get(tid) || [])) {
    const neg = (IX.collByCharge.get(c.id) || []).filter(x => Number(x.amount) < 0 && x.note === 'Credit used on other items');
    if (!neg.length) continue;
    let left = r2(-sum(neg, x => x.amount)); out.push(...neg);
    const dates = new Set(neg.map(x => x.received_on));
    const paid = (IX.chargesByPerson.get(c.person_id) || []).flatMap(ch => (IX.collByCharge.get(ch.id) || []))
      .filter(x => x.note === 'Paid using credit' && dates.has(x.received_on)).sort((a, b) => b.id - a.id);
    for (const x of paid) { if (left <= 0.004) break; out.push(x); left = r2(left - Number(x.amount)); }
  }
  return out;
}
function openCharges(pid) {
  return (IX.chargesByPerson.get(pid) || []).filter(c => live(c) && balance(c) > 0.004)
    .map(c => ({ c, t: IX.tx.get(c.transaction_id) }))
    .sort((a, b) => a.t.month.localeCompare(b.t.month) || (a.t.txn_date || '').localeCompare(b.t.txn_date || '') || a.c.id - b.c.id);
}
function allocate(pid, amount) {
  let left = r2(amount); const out = [];
  for (const { c, t } of openCharges(pid)) { if (left <= 0.004) break; const take = r2(Math.min(left, balance(c))); out.push({ c, t, take }); left = r2(left - take); }
  return { out, left };
}

const moneyTabs = () => `<div class="seg" style="margin-top:6px"><button class="${UI.mTab !== 'out' ? 'on' : ''}" data-action="mTab" data-v="sum">Summary</button><button class="${UI.mTab === 'out' ? 'on' : ''}" data-action="mTab" data-v="out">Cash outlook</button></div>`;
function billEstimate(cardId, m) {   // amount on the bill if saved, else app total (+ installment months not created yet)
  const proj = S.installments.filter(p => { if (p.card_id !== cardId || p.status !== 'active') return false;
    const no = monthDiff(m, p.first_month) + 1; return no >= 1 && no <= p.months && !(IX.txByInst.get(p.id) || []).some(t => t.installment_no === no); });
  const st = IX.stmt.get(cardId + '|' + m);
  if (st && st.total_due != null && st.total_due !== '') return { amt: r2(st.total_due), est: false, proj };
  const amt = sum(S.transactions.filter(t => t.card_id === cardId && t.month === m && !isConv(t)), t => t.amount) + sum(proj, p => p.monthly_amount);
  return { amt: r2(amt), est: true, proj };
}
function recurDates(r, from, to) {   // days a recurring item falls on, within [from, to]

    const [y, mo] = m.split('-').map(Number), dim = new Date(y, mo, 0).getDate();
    for (const day of [...new Set(r.days.map(x => Math.min(x, dim)))].sort((a, b) => a - b)) { const iso = `${y}-${pad(mo)}-${pad(day)}`; if (iso >= start && iso <= to) out.push(iso); }
  }

}
function outlookEvents(today, end) {

    const late = e.entry_date < today;
    ev.push({ date: late ? today : e.entry_date, amt: e.kind === 'income' ? Number(e.amount) : -Number(e.amount), label: e.description || catName(e.category_id),
      sub: (e.kind === 'income' ? 'Expected' : 'Not paid yet') + (late ? ` · late, was ${dateLabel(e.entry_date)}` : ''), action: `data-action="openEntry" data-id="${e.id}"`, got: e.id, kind: e.kind });
  }
  for (const r of S.recurring) if (r.active) for (const iso of recurDates(r, addDays(today, 1), end)) {   // salary etc. after today
    if (S.entries.some(e => e.recurring_id === r.id && e.entry_date === iso)) continue;
    ev.push({ date: iso, amt: r.kind === 'income' ? Number(r.amount) : -Number(r.amount), label: r.description, sub: 'Recurring', action: `data-action="openRec" data-id="${r.id}"` });
  }

    const k = `${c.person_id}|${date}|${why}`, o = owe.get(k) || { amt: 0, n: 0, since: t.month };

  }

    ev.push({ date, amt: o.amt, label: personName(+pid), sub: `${why === 'overdue' ? `Overdue since ${monthLabel(o.since)}` : why === 'to collect' ? 'To collect, due with the bill' : why === 'promised' ? 'Promised to pay you' : 'Promised, late'} · ${o.n} item${o.n === 1 ? '' : 's'}`, action: `data-action="openPerson" data-id="${pid}"` }); }

// Rounds of card dues: each round ends on the LAST card due date of that month (e.g. Oct 19).

  const { ev, notCounted } = outlookEvents(today, rounds[rounds.length - 1].end);
  let carry = r2(UI.cash || 0), from = today;
  for (const [i, r] of rounds.entries()) {   // running balance inside each round; what's left (or short) carries to the next
    r.from = from; r.start = carry; let bal = carry, min = carry, minDate = from, iMin = -1, shortDate = carry < -0.004 ? from : null;
    r.rows = ev.filter(x => x.date >= from && x.date <= r.end).map((x, j) => { bal = r2(bal + x.amt); if (bal < min - 0.004) { min = bal; minDate = x.date; iMin = j; } if (bal < -0.004 && !shortDate) shortDate = x.date; return { ...x, bal }; });
    Object.assign(r, { left: bal, min, minDate, shortDate, back: min < -0.004 ? r.rows.slice(iMin + 1).find(x => x.bal >= -0.004) : null,
      inSum: sum(r.rows.filter(x => x.amt > 0), x => x.amt), outSum: -sum(r.rows.filter(x => x.amt < 0), x => x.amt), next: rounds[i + 1]?.m || addMonths(r.m, 1) });
    carry = bal; from = addDays(r.end, 1);

  const rowMin = r.rows.length ? Math.min(...r.rows.map(x => x.bal)) : r.start;   // short = this round's money doesn't cover its dues (+ any carried loan)
  const payback = r.start < -0.004 ? r.rows.find(x => x.bal >= -0.004) : null;
  const loanNote = payback ? ` You pay back the ${peso(-r.start)} borrowed for ${M(prev.m)} dues on <b>${dateLabel(payback.date)}</b>, after ${esc(payback.label)}.` : '';

        ${r.back ? `You could pay it back on <b>${dateLabel(r.back.date)}</b>, after ${esc(r.back.label)}.` : `Money after ${dateLabel(r.end)} goes to ${M(r.next)} dues, so the loan is paid back from there.`}</div></div>`
    : `<div class="card t-mint"><div class="small muted">Enough for ${M(r.m)} dues</div><div class="big">${peso(r.left)} left</div>
        <div class="small" style="margin-top:4px">After the last due date (${dateLabel(r.end)}). It carries to ${M(r.next)} dues.${loanNote}</div></div>`;
  const startRow = ci === 0
    ? `<div class="item"><div class="grow"><div class="b">Now</div><div class="small muted">${dateLabel(today)} · money you have</div></div><div class="right b">${peso(r.start)}</div></div>`
    : `<div class="item"><div class="grow"><div class="b">${r.start < -0.004 ? `Borrowed for ${M(prev.m)} dues` : `Left from ${M(prev.m)} dues`}</div><div class="small muted">${dateLabel(r.from)} · carried over</div></div><div class="right b ${r.start < -0.004 ? 'over' : ''}">${peso(r.start)}</div></div>`;
  return `${moneyTabs()}
    <div class="card" style="margin-top:10px"><label class="f" style="margin:0"><span>Money you have now (bank + cash + GCash)</span>
      <input class="in" type="number" inputmode="decimal" step="0.01" data-cash value="${UI.cash ?? ''}" placeholder="e.g. 12000"></label>
      <div class="small muted" style="margin-top:4px">${UI.cash == null ? 'Type it in to start (counted as ₱0 for now). ' : UI.cashOn ? `Updated ${dateLabel(UI.cashOn)}. ` : ''}Saved on this device only.</div></div>
    <div class="seg" style="margin-top:10px">${rounds.map((x, i) => `<button class="${i === ci ? 'on' : ''}" data-action="oCycle" data-v="${i}">${M(x.m)} dues</button>`).join('')}</div>
    <div class="small muted" style="margin:6px 2px 0">Money in from <b>${dateLabel(r.from)}</b> to <b>${dateLabel(r.end)}</b>, the last card due date. Money after that goes to ${M(r.next)} dues.</div>
    <div style="margin-top:10px">${verdict}</div>
    <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
      ${S._exp ? `<button class="btn sm pri" data-action="newExpected" data-kind="income">＋ Expected money</button><button class="btn sm" data-action="newExpected" data-kind="expense">＋ Upcoming expense</button>` : ''}

    ${S._exp ? '' : `<div class="card small" style="margin-top:10px"><b>One more setup step</b> to add expected money: run <b>database/4-expected.sql</b> in Supabase → SQL Editor → New query → Run, then tap ☰ → Refresh data. Recurring salary and card bills already show below.</div>`}

    <div class="small muted" style="margin:4px 2px 0 26px">${UI.oPromises ? `Counted on their promise date, or by the due date of the bill if there's none. Overdue amounts count today. If someone won't pay in time, set a later promise date on that transaction.` : 'Off: only your own money counts (worst case).'}</div>

    <div class="card list">${startRow}
      ${r.rows.map(x => `<div class="item" ${x.action}><div class="grow"><div class="b ell">${esc(x.label)}</div><div class="small muted">${dateLabel(x.date)} · ${esc(x.sub)}</div>
        ${x.got ? `<button class="btn sm" style="margin-top:6px" data-action="gotEntry" data-id="${x.got}">${x.kind === 'income' ? 'Got it' : 'Paid'}</button>` : ''}</div>

    <p class="small muted">Card bills are the full amount you pay the bank: the amount on the bill if you saved it, otherwise the app total. Money riders owe counts on its promise date, or by its bill's due date if there's none. Late expected money still counts until you tap Got it or delete it.</p>`;
}

// Create due recurring entries (up to today) — only once per date, even if you delete one later.
async function ensureRecurring() {
  if (!S._money) return 0;
  const today = todayISO(), rows = [], touched = [];
  for (const r of S.recurring) {
    if (!r.active) continue;
    const from = r.generated_until ? addDays(r.generated_until, 1) : r.start_date;
    if (from > today) continue;
    for (let m = monthOf(from); m <= monthOf(today); m = addMonths(m, 1)) {
      const [y, mo] = m.split('-').map(Number), dim = new Date(y, mo, 0).getDate();
      for (const day of [...new Set(r.days.map(x => Math.min(x, dim)))]) {

const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
async function loadPdfjs() {
  if (window._pdfjs) return window._pdfjs;
  const pdfjs = await import(PDFJS_BASE + 'pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.mjs';
  return (window._pdfjs = pdfjs);
}
async function pdfPages(buf, password) {
  const pdfjs = await loadPdfjs();
  const doc = await pdfjs.getDocument({ data: buf, password: password || undefined }).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    pages.push(tc.items.filter(it => it.str && it.str.trim()).map(it => ({ s: it.str.replace(/\s+$/, ''), x: it.transform[4], y: it.transform[5], w: it.width })));
  }

}
// Group text pieces into lines (same height) and cells (pieces separated by a wide gap).
function pageLines(items, maxX = Infinity) {
  const its = items.filter(i => i.x < maxX).sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for (const it of its) {
    const L = lines[lines.length - 1];
    if (L && Math.abs(L.y - it.y) <= 2.5) L.items.push(it); else lines.push({ y: it.y, items: [it] });
  }
  return lines.map(l => {
    l.items.sort((a, b) => a.x - b.x);
    const cells = []; let cur = null, end = null;
    for (const it of l.items) {
      const gap = end == null ? 0 : it.x - end;
      if (!cur || gap > 12) { cur = { x: it.x, text: it.s.trim() }; cells.push(cur); }
      else cur.text += (gap > 1 ? ' ' : '') + it.s.trim();
      end = it.x + it.w;
    }
    return { y: l.y, cells, text: cells.map(c => c.text).join('   ') };
  });
}

  m = /\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/.exec(s);
  if (m) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return `${y}-${pad(m[1])}-${pad(m[2])}`; }

}

function findLabeled(lines, labelRe, parse) {

    for (const cell of lines[i].cells) {
      const m = labelRe.exec(cell.text); if (!m) continue;
      const after = parse(cell.text.slice(m.index + m[0].length)); if (after != null) return after;
      const right = lines[i].cells.find(c => c.x > cell.x && c.x - cell.x < 260 && parse(c.text) != null && !labelRe.test(c.text));
      if (right && right.x - cell.x < 200) return parse(right.text);
      for (let j = i + 1; j < Math.min(lines.length, i + 4); j++) {
        if (lines[i].y - lines[j].y > 45) break;
        const below = lines[j].cells.filter(c => Math.abs(c.x - cell.x) < 70 && parse(c.text) != null).sort((a, b) => Math.abs(a.x - cell.x) - Math.abs(b.x - cell.x))[0];

    x.kind = 'new'; x.on = true; x.plan = null; x.planNo = null; x.matchTx = null; x.makePlan = false;
    if (x.amount < 0 && /PAYMENT/i.test(x.desc)) { x.kind = 'payment'; x.on = false; continue; }
    const plans = S.installments.filter(p => p.card_id === x.cardId && p.status === 'active' && Math.abs(Number(p.monthly_amount) - x.amount) <= 0.05 && (x.n == null || p.months === x.n));

  try {
    for (const o of drop) await del('transactions', o.t.id);
    // 1) statement: due date / totals
    const s = IX.stmt.get(st.card_id + '|' + m);
    const srow = { due_date: st.info.due || null, total_due: st.info.total ?? null, min_due: st.info.min ?? null };
    if (s) await upd('statements', s.id, srow); else await ins('statements', [{ ...srow, card_id: st.card_id, month: m }]);
    // 2) new installment plans
    for (const x of pick.filter(x => x.kind === 'newplan' && x.makePlan)) {
      const [p] = await ins('installments', [{ card_id: x.cardId, item: x.desc, monthly_amount: x.amount, months: x.n, first_month: addMonths(m, -(x.k - 1)), status: 'active', notes: 'Created from PDF upload' }]);
      await ins('installment_shares', [{ installment_id: p.id, person_id: x.person, monthly_share: x.amount }]);
      x.plan = p; x.planNo = x.k; x.kind = 'inst';
    }
    // 3) installment months already listed by the app → mark as confirmed by the PDF
    for (const x of pick.filter(x => x.kind === 'inst' && x.matchTx)) await upd('transactions', x.matchTx.id, { txn_date: x.date, source: 'pdf' });
    // 4) everything else → new transactions + who pays
    const fresh = pick.filter(x => !(x.kind === 'inst' && x.matchTx));
    if (fresh.length) {
      const txs = await ins('transactions', fresh.map(x => ({ card_id: x.cardId, month: m, txn_date: x.date, description: x.desc + (x.k && !x.plan ? ` ${x.k}/${x.n}` : ''),
        category: x.kind === 'conv' ? CONVERTED : x.plan ? 'LOAN' : null, amount: x.amount, installment_id: x.plan?.id ?? null, installment_no: x.plan ? x.planNo : null, source: 'pdf' })));
      const rows = [];
      txs.forEach((t, i) => { const x = fresh[i];
        if (x.plan) for (const c of splitFromShares(x.plan)) rows.push({ ...c, transaction_id: t.id });
        else rows.push({ transaction_id: t.id, person_id: x.person || IX.me, amount: x.amount }); });
      await ins('charges', rows);
    }
    for (const x of pick.filter(x => x.kind === 'conv' && x.convTx)) await upd('transactions', x.convTx.id, { category: CONVERTED });
    await ensureInstallmentMonths();
    SHEETS.length = 0; drawSheets(); UI.month = m; UI.view = 'tx'; UI.f = { scope: 'month', card: String(st.card_id), people: [], status: '', q: '' };
    render(); toast(`Imported ${pick.length} line${pick.length === 1 ? '' : 's'}${drop.length ? ` · removed ${drop.length}` : ''}`);
  } catch (e) { console.error(e); toast('Import stopped: ' + (e.message || e)); }
}

/* ---------------- export ---------------- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function exportBackup() {
  const stamp = todayISO();
  const flat = S.transactions.flatMap(t => (IX.chargesByTx.get(t.id) || []).map(c => ({
    'Statement month': t.month.slice(0, 7), Card: cardCode(t.card_id), Date: t.txn_date || '', Description: t.description, Category: t.category || '',
    'Installment': t.installment_no ? `${t.installment_no}/${IX.inst.get(t.installment_id)?.months}` : '', 'Line amount': Number(t.amount),
    Person: personName(c.person_id), Share: Number(c.amount), Received: received(c), Balance: balance(c), Status: STATUS_LABEL[chargeStatus(c)],
    'Promise date': c.promise_date || '', Note: c.note || '' })));
  try {
    if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flat), 'Readable');
    for (const t of TABLES) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S[t]), t.slice(0, 31));
    XLSX.writeFile(wb, `cardsplit-backup-${stamp}.xlsx`);
  } catch (e) {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cardsplit-backup-${stamp}.json`; a.click();
    toast('Excel library did not load — saved a JSON backup instead');
  }
}

  openSheet({ title: 'Categories', body: () => ['expense', 'income'].map(k => `
    <div class="sec">${k === 'income' ? 'Income' : 'Expense'} (${catsOf(k).length})</div>
    <div class="chips">${catsOf(k).map(c => `<span class="chip" style="padding:6px 10px;font-size:13px">${esc(c.name)}</span>`).join('')}
      <button class="chip brand" style="border:0;cursor:pointer;padding:6px 10px;font-size:13px" data-action="newCategory" data-kind="${k}">＋ New</button></div>`).join('')
    + '<p class="small muted" style="margin-top:14px">Card transactions use the expense categories. To change one, open the transaction on Cards and pick it under Category.</p>' });
}
// "＋ New category…" in any category dropdown
function pickNewCategory(e) {
  const el = e.target;
  if (el.tagName !== 'SELECT' || el.value !== '__newcat') return;
  e.stopImmediatePropagation();
  const d = SHEETS[SHEETS.length - 1]?.draft, k = el.dataset.k, ri = el.dataset.ri;
  el.value = String(ri != null ? d.rows[+ri].category_id : (d?.[k] ?? ''));
  openNewCategory(el.dataset.cat || 'expense', c => {
    if (!d) return;
    if (ri != null) d.rows[+ri].category_id = c.id; else if (k === 'category') d.category = c.name; else if (k) d[k] = c.id;
    redrawTop();
  });
}
document.addEventListener('input', pickNewCategory, true);
document.addEventListener('change', pickNewCategory, true);
function pickNewPerson(e) {
  const el = e.target;
  if (el.tagName !== 'SELECT' || el.value !== '__new') return;
  e.stopImmediatePropagation();
  const owner = SHEETS[SHEETS.length - 1], d = owner?.draft;
  const li = el.dataset.li, ci = el.dataset.ci, si = el.dataset.si, isAll = el.id === 'setall';
  if (li != null) el.value = String(d.st.lines[+li].person); else if (ci != null) el.value = String(d.charges[+ci].person_id);
  else if (si != null) el.value = String(d.shares[+si].person_id); else if (el.dataset.k && d && el.dataset.k in d) el.value = String(d[el.dataset.k] ?? ''); else el.value = '';
  const k = el.dataset.k;
  openNewPerson(p => {
    if (!d) return render();
    if (li != null) d.st.lines[+li].person = p.id;
    else if (isAll) d.st.lines.forEach(x => { if (x.on && (x.kind === 'new' || x.kind === 'newplan')) x.person = p.id; });
    else if (ci != null) d.charges[+ci].person_id = p.id;
    else if (si != null) d.shares[+si].person_id = p.id;
    else if (k) d[k] = p.id;
    redrawTop(); render();
  }, { household: el.hasAttribute('data-hh') });
}
document.addEventListener('input', pickNewPerson, true);
document.addEventListener('change', pickNewPerson, true);
document.addEventListener('input', e => {
  const k = e.target.dataset?.filter; if (!k) return;
  UI.f[k] = e.target.value; if (k === 'q') UI._focusQ = true; render();
});

/* ---------------- boot ---------------- */
async function loadData() {
  $('#root').innerHTML = '<div class="center"><div class="muted">Loading…</div></div>';
  try {
    S = await db.loadAll();
    S._money = OPT_TABLES.every(t => Array.isArray(S[t])); for (const t of OPT_TABLES) if (!Array.isArray(S[t])) S[t] = [];
    S._exp = S._money && await db.hasExpected().catch(() => false);
    reindex();
    if (!IX.me) { await ins('people', [{ name: 'Me', kind: 'me' }]); }
    const made = await ensureInstallmentMonths();
    await ensureMoneyDefaults(); await ensureRecurring();
    render(); if (made) toast(`${made} installment month${made === 1 ? '' : 's'} added${UI._advMsg || ''}`); UI._advMsg = '';
  } catch (e) {
    console.error(e);
    $('#root').innerHTML = `<div class="center"><div class="loginbox card"><div class="b">Could not load your data</div><div class="err">${esc(e.message || e)}</div><button class="btn block" style="margin-top:12px" onclick="location.reload()">Try again</button></div></div>`;
  }
}
function loginScreen(msg = '') {
  $('#root').innerHTML = `<div class="center"><form class="loginbox card" id="login">
    <div class="big" style="margin-bottom:4px">CardSplit</div><div class="small muted">Log in with the account you made in Supabase.</div>
    <label class="f"><span>Email</span><input class="in" type="email" name="email" autocomplete="username" required></label>
    <label class="f"><span>Password</span><input class="in" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn pri block" type="submit">Log in</button><div class="err">${esc(msg)}</div></form></div>`;
  $('#login').addEventListener('submit', async e => {
    e.preventDefault(); const f = new FormData(e.target);
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
    if (error) loginScreen(error.message); else loadData();
  });
}
async function boot() {
  if (DEMO) {
    let seed = { people: [{ id: 1, name: 'Me', kind: 'me', active: true }] };
    try { const r = await fetch('demo-data.json'); if (r.ok) seed = await r.json(); } catch {}
    window._dbg = { get S() { return S; }, get IX() { return IX; }, SHEETS, get UI() { return UI; }, personName };   // demo only, for testing
    db = makeDemoDB(seed); return loadData();
  }
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY) {
    $('#root').innerHTML = `<div class="center"><div class="loginbox card"><div class="b">Almost there</div><p class="small">Open <b>index.html</b>, paste your Supabase <b>Project URL</b> and <b>Publishable key</b> into CONFIG at the top, and upload it again. See the setup guide.</p><p class="small muted">Want to look around first? Add <b>?demo</b> to the address.</p></div></div>`;
    return;
  }
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  sb = createClient(new URL(CONFIG.SUPABASE_URL.trim()).origin, CONFIG.SUPABASE_KEY.trim());   // keeps only https://xxxx.supabase.co
  db = makeSupabaseDB(sb);
  const { data } = await sb.auth.getSession();
  if (data.session) loadData(); else loginScreen();
}
boot();
</script>
